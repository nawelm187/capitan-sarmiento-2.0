// Arranca la descarga de los datos YA, en paralelo con three.js (main.js los toma de window.__early).
(function () {
  try {
    var get = function (u, v) {
      return fetch(v ? u + '?v=' + encodeURIComponent(v) : u, { cache: v ? 'default' : 'no-cache' }).then(function (r) {
        if (!r.ok) throw new Error(u + ': HTTP ' + r.status);
        return r.json();
      });
    };
    var meta = get('data/meta.json');
    var e = { 'data/meta.json': meta };
    ['sarmiento-osm.geojson', 'places.json', 'tours.json', 'guides.json', 'landmarks.json', 'casonas.json', 'mascots.json'].forEach(function (f) {
      e['data/' + f] = meta.then(function (m) { return get('data/' + f, m.version + (m.dataRev ? '.' + m.dataRev : '')); });
    });
    Object.keys(e).forEach(function (k) { e[k].catch(function () {}); });
    window.__early = e;
  } catch (_) {}
})();
</script>
<script>
// Aviso si la carga se cuelga: en vez de quedarse en 0 % muestra qué pasó y cómo salir.
(function () {
  var shown = false;
  function aviso(motivo) {
    if (shown) return;
    var pct = document.getElementById('splash-pct');
    var sp = document.getElementById('splash');
    if (!sp || sp.classList.contains('hide')) return;
    shown = true;
    var d = document.createElement('div');
    d.style.cssText = 'margin-top:14px;max-width:460px;font:14px/1.45 system-ui,sans-serif;background:rgba(0,0,0,.35);padding:12px 14px;border-radius:12px';
    d.innerHTML = '<b>La web no pudo arrancar.</b><br>' + motivo + '<br><br>Probá: <b>Ctrl+F5</b>. Si sigue igual: <button id="wd-reset" style="padding:6px 10px;border-radius:8px;border:0;cursor:pointer">Borrar caché y reintentar</button>';
    sp.appendChild(d);
    document.getElementById('wd-reset').onclick = function () {
      var t = [];
      if (navigator.serviceWorker) t.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
      if (window.caches) t.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
      Promise.all(t).catch(function () {}).then(function () { location.reload(); });
    };
  }
  window.addEventListener('error', function (e) {
    var t = e.target && e.target.src ? ' (' + e.target.src.split('/').slice(-2).join('/') + ')' : '';
    if (e.target && e.target !== window) { if (e.target.tagName === 'SCRIPT') aviso('No se pudo cargar un archivo' + t + '.'); return; }
    aviso('Error: ' + (e.message || 'desconocido') + (e.filename ? ' en ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '.');
  }, true);
  window.addEventListener('unhandledrejection', function (e) { aviso('Error: ' + ((e.reason && e.reason.message) || e.reason) + '.'); });
  setTimeout(function () {
    var pct = document.getElementById('splash-pct');
    if (pct && parseInt(pct.textContent, 10) > 5) return; // va cargando, solo es lento
    aviso('Tardó más de 25 segundos sin avanzar (internet, o un archivo viejo guardado).');
  }, 25000);
})();
</script>
