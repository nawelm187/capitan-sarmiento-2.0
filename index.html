<script>
// Arranca la descarga de los datos YA, en paralelo con three.js (main.js los toma de window.__early).
(function () {
  try {
    var get = function (u, v) {
      return fetch(v ? u + '?v=' + encodeURIComponent(v) : u, { cache: v ? 'default' : 'no-cache' }).then(function (r) {
        if (!r.ok) throw new Error(u + ': HTTP ' + r.status);
        return r.json();
      });
    };
    var meta = get('data/meta.json');
    var e = { 'data/meta.json': meta };
    ['sarmiento-osm.geojson', 'places.json', 'tours.json', 'guides.json', 'landmarks.json', 'casonas.json', 'mascots.json'].forEach(function (f) {
      e['data/' + f] = meta.then(function (m) { return get('data/' + f, m.version); });
    });
    Object.keys(e).forEach(function (k) { e[k].catch(function () {}); });
    window.__early = e;
  } catch (_) {}
})();
</script>
